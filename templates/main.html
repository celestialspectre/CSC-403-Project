<!DOCTYPE html>

<head>
    <title>Main Menu</title>
    <link rel="stylesheet" href="static/styles/skeleton.css" />
</head>

<body>
    <div class="main_elements">
        <div class="char_container">
            <form>
                <button
                    style="background-color:antiquewhite; height:50px; width:400px; font-size: large; font-family: 'Times New Roman', Times, serif; font-weight: bold; text-align: left; padding-left:15px"
                    formaction="/character-creator">
                    New Character
                </button>
            </form>
    
<form action="{{ url_for('parties_page') }}" method="GET">
    <button type="submit" style="
        width: 180px;
        height: 55px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
    ">
        Party Management
    </button>
</form>


            <!-- replaced hard coded characters with saved character list -->
            {% for character in characters %}
            <a class="character-link" href="{{ url_for('character_sheet', character_id=character[0]) }}">
                <h2>{{ character[1] }}</h2>
                <h4>Lv. {{ character[3] }} · {{ character[2] or 'Adventurer' }}</h4>
            </a>
            {% else %}
            <p id="empty_warning">No saved characters yet. Select New Character to get started.</p>
            {% endfor %}
        </div>

        <div class="page-container">
            <form action="{{ url_for('dice_roller') }}" method="GET" style="margin: 0;">
                <button type="submit" style="height: 65px; width: 200px; font-size: 20px;">Dice Roller</button>
                <button type="submit" style="height: 65px; width: 200px; font-size: 20px;" formaction="{{ url_for('get_party_logs', party_id=1) }}">Campaign Log</button>
                <!--<button type="submit" style="height: 65px; width: 200px; font-size: 20px;" formaction="/spells">Spells</button>-->
                <button type="submit" style="height: 65px; width: 200px; font-size: 20px;" formaction="/conditions">Conditions</button>
            </form>
        </div>
    </div>
</body>
