
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/skeleton.css') }}" />
</head>

<body>
    <center>

        <div class="login_border">
            <h1>Welcome to the D&D Character Hub!</h1>
            <h1 style="color:rgb(49, 49, 49); font-size: 37px;">Create an Account</h1>

            <!-- Displays registration errors -->
            {% if error %}
                <p class="message" style="color: red;">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST">

                <label for="username">Username</label>
                <br />
                <input class="field" type="text"
                       id="username" name="username"
                       minlength="3" maxlength="40" required />
                <br />

                <label for="password">Password</label>
                <br />
                <input class="field" type="password"
                       id="password" name="password"
                       minlength="8" required />
                <br />

                <label for="confirm_password">Confirm Password</label>
                <br />
                <input class="field" type="password"
                       id="confirm_password" name="confirm_password"
                       minlength="8" required />
                <br />
                <br />

                <button type="submit">Register</button>
            </form>

            <br />

            <form action="{{ url_for('login') }}" method="GET">
                <button type="submit">Return to Login</button>
            </form>

            
            <p>*Note: Password must be at least 8 characters long and contain 1 special character</p>
        </div>

        <marquee>
            <img src="{{ url_for('static', filename='img/dnd.png') }}"
                 style="width: 10%; height: auto;" />
        </marquee>

    </center>
</body>
</html>
