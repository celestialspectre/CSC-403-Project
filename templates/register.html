
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/skeleton.css') }}" />
</head>

<body>
    <center>
        <div id="triangle-down" class="border-decor"></div>

        <div class="login_border">
            <h1>Welcome to the D&D Character Hub!</h1>
            <h2>Create an Account</h2>

            <!-- Displays registration errors -->
            {% if error %}
                <p class="message">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST">

                <label for="username">Username</label>
                <br />
                <input class="field" type="text"
                       id="username" name="username"
                       minlength="3" maxlength="40" required />
                <br />

                <label for="password">Password</label>
                <br />
                <input class="field" type="password"
                       id="password" name="password"
                       minlength="8" required />
                <br />

                <label for="confirm_password">Confirm Password</label>
                <br />
                <input class="field" type="password"
                       id="confirm_password" name="confirm_password"
                       minlength="8" required />
                <br />
                <br />

                <button type="submit">Register</button>

                <p>*Note: Password must be at least 8 characters long.</p>

            </form>

            <form action="{{ url_for('login') }}" method="GET">
                <button type="submit">Return to Login</button>
            </form>
        </div>

        <marquee>
            <img src="{{ url_for('static', filename='img/dnd.png') }}"
                 style="width: 10%; height: auto;" />
        </marquee>

        <div id="triangle-up" class="border-decor"></div>
    </center>
</body>
</html>
