    {%for cond in conditions%}
    <div class="status-entry" style="color: white; font-family: 'Young Serif'; justify-self: center; width: 70%;">
        <h2 style="text-align: left;">{{cond["name"]}}</h2>
        <div class="line" style="background-color: rgb(177, 177, 177); height: 2px; width: 90%; margin-top: -15px; margin-bottom: 10px;"></div>
        
        <list>
            {%for desc in cond["description"]%}
            <li>{{desc}}</li>
            {%endfor%}
        </list>
    </div>
    <br />
    {%endfor%}
