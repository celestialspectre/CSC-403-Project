
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Forgot Password - D&D Character Hub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles/skeleton.css') }}">

    <style>
        .recovery-panel {
            max-width: 520px;
            margin: 30px auto;
        }

        .recovery-panel h2,
        .recovery-panel label {
            color: #2b211b;
            margin: 16px 0;
        }

        .recovery-panel input {
            padding: 10px;
            margin: 8px;
            width: min(90%, 340px);
        }

        .recovery-panel button {
            padding: 10px 20px;
            margin: 10px;
        }

        .recovery-panel p {
            color: #2b211b;
        }
    </style>
</head>

<body>
    <center>
        <div id="triangle-down" class="border-decor"></div>

        <div class="login_border recovery-panel">

            <h1>D&D Character Hub</h1>
            <h2>Forgot Password</h2>

            <p>
                Enter your registered email address
                to request a reset link.
            </p>

            {% if error %}
                <p role="alert">{{ error }}</p>
            {% endif %}

            {% if message %}
                <p role="status">{{ message }}</p>
            {% endif %}

            <form method="POST"
                  action="{{ url_for('forgot_password') }}">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >

                <label for="email">Email Address</label>
                <br />

                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="254"
                    required
                    autocomplete="email"
                >
                <br />

                <button type="submit">
                    Request Reset Link
                </button>

            </form>

            <p>
                <a href="{{ url_for('login') }}">
                    Return to Login
                </a>
            </p>

        </div>

        <div id="triangle-up" class="border-decor"></div>
    </center>
</body>
</html>
