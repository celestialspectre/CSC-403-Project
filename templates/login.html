
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles/skeleton.css') }}" />
</head>

<body>
    <center>
        <div id="triangle-down" class="border-decor"></div>

        <div class="login_border">
            <h1>Welcome to the D&D Character Hub!</h1>

            <form action="{{ url_for('login') }}" method="POST">

                <label for="username">Username</label>
                <br />
                <input
                    class="field"
                    type="text"
                    id="username"
                    name="username"
                    required
                />
                <br />

                <label for="password">Password</label>
                <br />
                <input
                    class="field"
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    required
                />
                <br />
                <br />
                
                <button type="submit">Login</button>
            </form>

            <br />
            
            <form action="{{ url_for('register') }}" method="GET">
                <button type="submit">Create Account</button>
            </form>

            <p>*Note: Password must be at least 8 characters long and contain 1 special character.</p>

            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}

            {% if reset_success %}
                <p style="color: green;">
                    Password updated. Please log in.
                </p>
            {% endif %}

            <p>
                <a href="{{ url_for('forgot_password') }}">
                    Forgot Password?
                </a>
            </p>

            <form action="{{ url_for('register') }}" method="GET">
                <button type="submit">Register</button>
            </form>
        </div>

        <marquee>
            <img
                src="{{ url_for('static', filename='img/dnd.png') }}"
                style="width: 10%; height: auto;"
            />
        </marquee>

        <div id="triangle-up" class="border-decor"></div>
    </center>
</body>
</html>
