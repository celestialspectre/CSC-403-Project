
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reset Password - D&D Character Hub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles/skeleton.css') }}">

    <style>
        .recovery-panel {
            max-width: 520px;
            margin: 30px auto;
        }

        .recovery-panel h2,
        .recovery-panel label {
            color: #2b211b;
            margin: 16px 0;
        }

        .recovery-panel input {
            padding: 10px;
            margin: 8px;
            width: min(90%, 340px);
        }

        .recovery-panel button {
            padding: 10px 20px;
            margin: 10px;
        }

        .recovery-panel p {
            color: #2b211b;
        }
    </style>
</head>

<body>
    <center>
        <div id="triangle-down" class="border-decor"></div>

        <div class="login_border recovery-panel">

            <h1>D&D Character Hub</h1>
            <h2>Reset Password</h2>

            {% if not valid %}

                <p>
                    This reset link is invalid, expired,
                    or has already been used.
                </p>

                <p>
                    <a href="{{ url_for('forgot_password') }}">
                        Request a new link
                    </a>
                </p>

            {% else %}

                {% if error %}
                    <p role="alert">{{ error }}</p>
                {% endif %}

                <form
                    method="POST"
                    action="{{ url_for('reset_password', token=token) }}"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token }}"
                    >

                    <label for="password">
                        New Password
                    </label>
                    <br />

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                    <br />

                    <label for="confirm_password">
                        Confirm New Password
                    </label>
                    <br />

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                    <br />

                    <button type="submit">
                        Update Password
                    </button>

                </form>

            {% endif %}

            <p>
                <a href="{{ url_for('login') }}">
                    Return to Login
                </a>
            </p>

        </div>

        <div id="triangle-up" class="border-decor"></div>
    </center>
</body>
</html>
